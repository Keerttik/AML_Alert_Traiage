name: AML Copilot Guardrails & Regulatory Evaluation CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate-guardrails:
    name: Evaluate Compliance Guardrails (Zero False Negatives)
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Execute 75-Scenario Golden Evaluation Harness
        run: |
          python evaluation/run_evaluation.py

      - name: Validate Regulatory Guardrail Gates
        run: |
          python evaluation/validate_ci_gate.py
